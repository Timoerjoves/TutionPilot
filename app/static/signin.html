<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TuitionPilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233be38a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
</head>
<body class="site">
  <div class="auth">
    <aside class="auth-side">
      <div class="rays" aria-hidden="true">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <defs><linearGradient id="streak" x1="0" x2="1"><stop offset="0" stop-color="#3be38a" stop-opacity="0"/><stop offset="1" stop-color="#3be38a"/></linearGradient></defs>
          <path class="ray" d="M1000 0 C 700 300, 400 500, 0 1000"/><path class="ray" d="M1000 140 C 720 400, 440 600, 100 1000"/>
          <path class="ray" d="M1000 280 C 760 500, 520 700, 260 1000"/><path class="streak" d="M1000 140 C 720 400, 440 600, 100 1000"/>
        </svg>
      </div>
      <div class="glow g1" aria-hidden="true"></div>
      <a class="wordmark" href="/" aria-label="TuitionPilot home">tuition<b>pilot</b></a>
      <div>
        <div class="kicker" style="color:rgba(245,245,242,.6)">Passwordless</div>
        <h1 class="display words" style="margin-top:18px">No passwords. <em>Your device</em> is your key.</h1>
        <div class="keyviz" aria-hidden="true"><span class="k">SERVER</span><span class="ln"></span><span class="k">NONCE</span><span class="ln"></span><span class="k g">SIGNED</span></div>
        <ul class="ticks" style="margin-top:30px">
          <li>The private key never leaves this browser</li>
          <li>Each sign-in signs a one-time challenge</li>
          <li>New devices need the PIN and a parent device's approval</li>
        </ul>
      </div>
      <p class="tiny" style="color:rgba(245,245,242,.45)">Sandbox demo · synthetic data</p>
    </aside>

    <main class="auth-main">
      <section class="card auth-card" id="auth" aria-live="polite">
        <div class="empty"><span class="spinner"></span></div>
      </section>
      <p class="faint tiny center"><a class="link" href="/">← Back to home</a></p>
    </main>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="common.js"></script>
  <script src="site.js"></script>
  <script src="signin.js"></script>
</body>
</html>
